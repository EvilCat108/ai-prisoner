# Cloudflare Workers configuration for AI Prisoner Dilemma Arena
name = "ai-prisoner"
main = "index.js"
compatibility_date = "2026-04-01"   # Updated to current year

# D1 Database binding (shared across environments)
[[d1_databases]]
binding = "DB"
database_name = "ai_prisoner_db"
database_id = "REPLACED_DATABASE_ID"

# ======================
# Production Environment
# ======================
[env.production]
name = "ai-prisoner"

# D1 Database binding (production)
[[env.production.d1_databases]]
binding = "DB"
database_name = "ai_prisoner_db"
database_id = "REPLACED_DATABASE_ID"

# Environment variables
[env.production.vars]
ENVIRONMENT = "cloudflare"
LOG_LEVEL = "info"
MAX_MATCHES_PER_AGENT = "100"
ROUNDS_PER_MATCH = "50"

# ======================
# Build Configuration (for Go + WASM)
# ======================
[build]
command = "node build.js"
cwd = "."

# ======================
# Observability & Limits
# ======================
[observability]
enabled = true

[limits]
cpu_milliseconds = 50000