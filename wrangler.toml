# Cloudflare Workers configuration for AI Prisoner Dilemma Arena
name = "ai-prisoner"
main = "index.js"
compatibility_date = "2026-04-01"   # Updated to current year
compatibility_flags = ["no_handle_cross_request_promise_resolution"]

[vars]
GAME_URL = "http://example.com"

# D1 Database binding (shared across environments)
[[d1_databases]]
binding = "DB"
database_name = "ai_prisoner_db"
database_id = "REPLACED_DATABASE_ID"

# Durable Object — singleton AI umpire
[[durable_objects.bindings]]
name       = "UMPIRE"
class_name = "TheUmpire"

[[migrations]]
tag              = "v1"
new_sqlite_classes = ["ClaudeAgent"]

[[migrations]]
tag              = "v2"
renamed_classes = [
  { from = "ClaudeAgent", to = "Sheriff" }
]

[[migrations]]
tag              = "v3"
renamed_classes = [
  { from = "Sheriff", to = "TheUmpire" }
]

# ======================
# Production Environment
# ======================
[env.production]
name = "ai-prisoner"
routes = [
  { pattern = "gambledonai.com", zone_id = "REPLACED_ZONE_ID", custom_domain = true },
  { pattern = "gambledon.ai", custom_domain = true }
]

# Weekly ELO decay (Sundays 00:00 UTC) for inactive non-provisional agents
[env.production.triggers]
crons = ["0 0 * * 0"]

# D1 Database binding (production)
[[env.production.d1_databases]]
binding = "DB"
database_name = "ai_prisoner_db"
database_id = "REPLACED_DATABASE_ID"

# Durable Object (production)
[[env.production.durable_objects.bindings]]
name       = "UMPIRE"
class_name = "TheUmpire"

[[env.production.migrations]]
tag              = "v1"
new_sqlite_classes = ["ClaudeAgent"]

[[env.production.migrations]]
tag              = "v2"
renamed_classes = [
  { from = "ClaudeAgent", to = "Sheriff" }
]

[[env.production.migrations]]
tag              = "v3"
renamed_classes = [
  { from = "Sheriff", to = "TheUmpire" }
]

# Environment variables
[env.production.vars]
ENVIRONMENT = "cloudflare"
LOG_LEVEL = "info"
MAX_MATCHES_PER_AGENT = "100"
ROUNDS_PER_MATCH = "50"
GAME_URL = "https://gambledon.ai"
UMPIRE_MODEL = "deepseek-v4-flash"

# Secrets — set via: npx wrangler secret put DEEPSEEK_API_KEY --env production

# ======================
# Observability & Limits
# ======================
[observability]
enabled = true