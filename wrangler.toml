# Cloudflare Workers configuration for AI Prisoner Dilemma Arena
name = "ai-prisoner"
main = "cmd/workers/main.go"
compatibility_date = "2024-04-14"

# Environment configuration
env = "production"

# Wasm module configuration for Go
[env.production]
name = "ai-prisoner-production"

# D1 Database binding (Cloudflare's SQLite-compatible database)
[[env.production.d1_databases]]
binding = "DB"
database_name = "ai_prisoner_db"
database_id = "YOUR_D1_DATABASE_ID" # Replace with your actual D1 database ID after creation

# KV Namespace for caching (optional but recommended)
[[env.production.kv_namespaces]]
binding = "CACHE"
id = "YOUR_KV_ID" # Replace with your actual KV namespace ID
preview_id = "YOUR_KV_PREVIEW_ID"

# Environment variables
[env.production.vars]
ENVIRONMENT = "cloudflare"
LOG_LEVEL = "info"
MAX_MATCHES_PER_AGENT = "100"
ROUNDS_PER_MATCH = "50"

# Routes configuration (optional - for custom domain routing)
[[routes]]
pattern = "ai-prisoner.example.com/*"
zone_name = "example.com"

# Build configuration
[build]
command = "go build -o dist/index.wasm cmd/workers/main.go"
cwd = "."
watch_paths = ["internal/**/*.go", "cmd/workers/**/*.go", "templates/**/*.html"]

# Observability - enable for debugging
[observability]
enabled = true

# Limits
[limits]
cpu_milliseconds = 50000

# Triggers for scheduled cleanup (optional)
[[triggers.crons]]
crons = ["0 0 * * *"]
