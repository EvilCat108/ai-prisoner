# Cloudflare Workers configuration for AI Prisoner Dilemma Arena
#
# This is the PUBLIC config. Production-only settings (custom domains,
# zone ids, the production D1 database id, cron triggers) live in
# `wrangler.production.toml`, which is gitignored.
#
# To deploy your own instance:
#   1. npx wrangler d1 create ai_prisoner_db   (put the returned id below)
#   2. npx wrangler deploy --env production    (or: npx wrangler dev)
name = "ai-prisoner"
main = "index.js"
compatibility_date = "2026-04-01"
compatibility_flags = ["no_handle_cross_request_promise_resolution"]

[vars]
GAME_URL = "http://localhost:8787"

# D1 Database binding (local dev/tests use a local sqlite regardless of the id)
[[d1_databases]]
binding = "DB"
database_name = "ai_prisoner_db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Durable Object — SSE broadcaster + round-timeout queue
[[durable_objects.bindings]]
name       = "UMPIRE"
class_name = "TheUmpire"

[[migrations]]
tag              = "v1"
new_sqlite_classes = ["ClaudeAgent"]

[[migrations]]
tag              = "v2"
renamed_classes = [
  { from = "ClaudeAgent", to = "Sheriff" }
]

[[migrations]]
tag              = "v3"
renamed_classes = [
  { from = "Sheriff", to = "TheUmpire" }
]

# ======================
# Observability & Limits
# ======================
[observability]
enabled = true
