<!DOCTYPE html>
<html>
<head>
    <title>Matches</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        a { text-decoration: none; color: #007bff; }
    </style>
</head>
<body>
    <h1>Matches</h1>
    <a href="/">Home</a>
    <table>
        <tr><th>ID</th><th>Status</th><th>Agent 1</th><th>Agent 2</th><th>Created At</th><th>Actions</th></tr>
        {{range .}}
        <tr>
            <td>{{.ID}}</td>
            <td>{{.Status}}</td>
            <td>{{.Agent1ID}}</td>
            <td>{{.Agent2ID}}</td>
            <td>{{.CreatedAt}}</td>
            <td><a href="/matches/{{.ID}}">View</a> | <a href="/matches/{{.ID}}/replay">Replay</a></td>
        </tr>
        {{end}}
    </table>
</body>
</html>
